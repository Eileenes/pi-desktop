name: Package desktop app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            script: package:mac
          - os: windows-2025
            script: package:win
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Configure macOS signing
        if: matrix.os == 'macos-14'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: 8RK3WCWST9
        run: |
          if [ -n "$MACOS_CERTIFICATE" ]; then
            {
              echo 'CSC_LINK<<__CSC_LINK__'
              echo "$MACOS_CERTIFICATE"
              echo '__CSC_LINK__'
              echo "CSC_KEY_PASSWORD=$MACOS_CERTIFICATE_PASSWORD"
              echo "CSC_IDENTITY_AUTO_DISCOVERY=true"
              printf '%s' "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
              test -s "$RUNNER_TEMP/AuthKey.p8"
              grep -q 'BEGIN PRIVATE KEY' "$RUNNER_TEMP/AuthKey.p8"
            } >> "$GITHUB_ENV"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi

      - name: Validate Apple notarization credentials
        if: matrix.os == 'macos-14'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcrun notarytool --version
          test -r "$RUNNER_TEMP/AuthKey.p8"
          openssl pkey -in "$RUNNER_TEMP/AuthKey.p8" -noout
          APPLE_API_KEY_ID="$(printf '%s' "$APPLE_API_KEY_ID" | tr -d '\r\n' | xargs)"
          APPLE_API_ISSUER="$(printf '%s' "$APPLE_API_ISSUER" | tr -d '\r\n' | xargs)"
          test -n "$APPLE_API_KEY_ID"
          printf '%s' "$APPLE_API_ISSUER" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          echo "Apple notarization credentials file and metadata are valid"

      - name: Package application
        run: npm run ${{ matrix.script }}

      - name: Submit macOS app for notarization
        if: matrix.os == 'macos-14'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          APPLE_API_KEY_ID="$(printf '%s' "$APPLE_API_KEY_ID" | tr -d '\r\n' | xargs)"
          APPLE_API_ISSUER="$(printf '%s' "$APPLE_API_ISSUER" | tr -d '\r\n' | xargs)"
          ditto -c -k --sequesterRsrc --keepParent \
            "release/mac-arm64/Pi Agent.app" "$RUNNER_TEMP/Pi-Agent.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Pi-Agent.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait --output-format json
          xcrun stapler staple "release/mac-arm64/Pi Agent.app"
          xcrun stapler validate "release/mac-arm64/Pi Agent.app"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v6
        with:
          name: pi-desktop-${{ matrix.os }}
          path: release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          pattern: pi-desktop-*
          merge-multiple: true

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
